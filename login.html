<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            color: #1e293b;
            background: #f8fafc;
        }

        .card {
            width: 100%;
            max-width: 360px;
            padding: 32px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #fff;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 24px;
            font-weight: 600;
            color: #2563eb;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        input:focus {
            border-color: #2563eb;
            outline: 2px solid #bfdbfe;
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 11px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .hint {
            margin: 20px 0 0;
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }

        a {
            color: #2563eb;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Login</h1>

        <form action="#" method="post">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>

            <button type="submit">Sign in</button>
        </form>

        <p class="hint">Don't have an account? <a href="signup.html">Sign up</a></p>
        <p class="hint"><a href="index.html">Back to home</a></p>
    </main>
</body>

</html>
